<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live scores, fixtures, standings, top scorers and match stats for the Premier League, La Liga, Serie A, Bundesliga, Ligue 1 and Champions League."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ပွဲချိန်" />

      property="og:description"
      content="Live scores, fixtures, standings, top scorers and match stats for Europe's top football leagues."
    />
    <meta name="twitter:card" content="summary" />
    <script>
      // Set the saved theme BEFORE the page paints, so there is no flash of the wrong colours.
      try {
        var saved = localStorage.getItem('pwechein-theme')
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ပွဲချိန် — Live Football Scores & Stats</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
